name: Recipe App CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloud Run after validation (uses Workload Identity Federation)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: recipe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test backend, frontend, and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run backend tests
        run: npm test --prefix backend -- --runInBand
      - name: Run frontend tests
        run: npm test --prefix frontend -- --threads=false
      - name: Build frontend assets
        run: npm run build --prefix frontend
      - name: Validate backend Docker image
        run: docker build -t recipe-backend:ci ./backend
      - name: Validate frontend Docker image
        run: docker build -t recipe-frontend:ci ./frontend

  deploy:
    name: Deploy tested application to Cloud Run
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: project-63de95f5-a7d6-4569-9a2
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1053892050255/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: recipe-build-deployer@project-63de95f5-a7d6-4569-9a2.iam.gserviceaccount.com
          project_id: project-63de95f5-a7d6-4569-9a2
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Verify source bucket access
        run: gcloud storage buckets describe "gs://${GCP_PROJECT_ID}_cloudbuild" --format='value(name)'
      - name: Build and deploy backend using Cloud Build
        run: gcloud builds submit --project="$GCP_PROJECT_ID" --config=cloudbuild-backend.yaml .
      - name: Build and deploy frontend using Cloud Build
        run: gcloud builds submit --project="$GCP_PROJECT_ID" --config=cloudbuild-frontend.yaml .
      - name: Verify deployed endpoints
        run: |
          BACKEND_URL=$(gcloud run services describe recipe-backend --project="$GCP_PROJECT_ID" --region=us-central1 --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe recipe-frontend --project="$GCP_PROJECT_ID" --region=us-central1 --format='value(status.url)')
          curl --fail --retry 3 "$BACKEND_URL/api/health"
          curl --fail --retry 3 "$FRONTEND_URL"
          echo "Backend: $BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: $FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"
