steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:$BUILD_ID', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:$BUILD_ID']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - recipe-backend
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:$BUILD_ID
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --port=5000
      - --service-account=1053892050255-compute@developer.gserviceaccount.com
      - --min-instances=0
      - --max-instances=1
      - --quiet
options:
  logging: CLOUD_LOGGING_ONLY
